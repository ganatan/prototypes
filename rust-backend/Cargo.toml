[package]
name = "rust-starter"
version = "1.0.0"
edition = "2024"
description = "Demo project for Rust"

[dependencies]
axum = "0.8"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "derive"
] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net"
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }